<main class="celebration">
  <div class="confetti" aria-hidden="true">
    @for (piece of pieces; track $index) {
      <i [style.--i]="$index">{{ piece }}</i>
    }
  </div>
  <section>
    <p class="kicker">{{ 'CELEBRATION.KICKER' | translate }}</p>
    <h1>{{ 'CELEBRATION.TITLE' | translate }} 💖</h1>
    <app-chibi-bears [compact]="true" />
    <p>{{ 'CELEBRATION.MESSAGE' | translate }}</p>
    <button (click)="openLetter()">
      {{ 'CELEBRATION.OPEN_LETTER' | translate }} <span>💌</span>
    </button>
  </section>
</main>
