<main class="welcome">
  <section class="question-card" #card aria-labelledby="main-question">
    <div class="art"><app-chibi-bears [compact]="true" /></div>
    <div class="copy">
      <p class="eyebrow">{{ config.eyebrow | translate }}</p>
      <h2 id="main-question">{{ config.question | translate }}</h2>
      <p class="note">{{ 'HOME.NOTE' | translate }}</p>
      <div class="actions">
        <button class="yes" (click)="accept()">{{ 'HOME.YES' | translate }} <span>💖</span></button>
        <button
          #noButton
          class="no"
          [class.free]="attempts() > 0 && attempts() < maxAttempts"
          [style.left.px]="position().x"
          [style.top.px]="position().y"
          (pointerenter)="dodge($event)"
          (pointerdown)="dodge($event)"
          (click)="gentleNo()"
        >
          {{ noText() | translate }}
        </button>
      </div>
      @if (message()) {
        <p class="gentle" role="status">{{ message() | translate }}</p>
      }
    </div>
  </section>
</main>
