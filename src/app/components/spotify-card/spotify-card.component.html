<section class="spotify-section section" id="banda-sonora" aria-labelledby="spotify-title">
  <span class="decoration heart" aria-hidden="true">♡</span>
  <span class="decoration sparkle" aria-hidden="true">✦</span>
  <span class="decoration note" aria-hidden="true">♪</span>

  <div class="spotify-card">
    <div class="artwork" aria-hidden="true">
      <div class="vinyl"><i></i></div>
      <img [src]="spotifyPlaylistCover" alt="" (error)="useFallbackCover($event)" />
    </div>

    <div class="copy">
      <p class="eyebrow">{{ 'SPOTIFY_CARD.EYEBROW' | translate }}</p>
      <h2 id="spotify-title">{{ 'SPOTIFY_CARD.TITLE' | translate }}</h2>
      <strong class="playlist-name">{{ spotifyPlaylistName }}</strong>
      <p class="description">{{ 'SPOTIFY_CARD.DESCRIPTION' | translate }}</p>

      <a
        class="spotify-link"
        [href]="spotifyPlaylistUrl"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="'SPOTIFY_CARD.ARIA_LABEL' | translate: { name: spotifyPlaylistName }"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm4.58 14.42a.75.75 0 0 1-1.03.25c-2.82-1.73-6.38-2.12-10.56-1.16a.75.75 0 1 1-.34-1.46c4.58-1.05 8.51-.6 11.68 1.34.35.22.46.68.25 1.03Zm1.47-3.27a.94.94 0 0 1-1.29.31c-3.23-1.98-8.15-2.55-11.97-1.39a.94.94 0 1 1-.55-1.79c4.37-1.33 9.8-.69 13.5 1.58.44.27.58.85.31 1.29Zm.13-3.4C14.3 7.45 7.9 7.23 4.2 8.35a1.12 1.12 0 1 1-.65-2.14c4.25-1.29 11.32-1.02 15.78 1.62a1.12 1.12 0 0 1-1.15 1.92Z"
          />
        </svg>
        <span>{{ 'SPOTIFY_CARD.BUTTON' | translate }}</span>
      </a>
    </div>
  </div>
</section>
