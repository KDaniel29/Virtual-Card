<section class="section" id="razones">
  <header>
    <span>{{ 'REASONS.EYEBROW' | translate }}</span>
    <h2>{{ 'REASONS.TITLE' | translate }}</h2>
    <p>{{ 'REASONS.INTRO' | translate }}</p>
  </header>
  <div class="reasons">
    @for (reason of config.reasons; track reason; let index = $index) {
      <article>
        <b>0{{ index + 1 }}</b>
        <span>♥</span>
        <p>{{ reason | translate }}</p>
      </article>
    }
  </div>
</section>
