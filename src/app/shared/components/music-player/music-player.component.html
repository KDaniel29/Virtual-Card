<button
  (click)="music.toggle()"
  [attr.aria-label]="music.playing() ? 'Pausar música' : 'Reproducir música'"
  [title]="
    music.available() ? 'Música romántica' : 'Agrega tu canción en public/assets/audio/suerte.mp3'
  "
>
  {{ music.playing() ? 'Ⅱ' : '♪' }}
  <span>{{ music.playing() ? 'Pausar' : 'Música' }}</span>
</button>
