<button
  (click)="music.toggle()"
  [attr.aria-label]="(music.playing() ? 'MUSIC.PAUSE_ARIA' : 'MUSIC.PLAY_ARIA') | translate"
  [title]="(music.available() ? 'MUSIC.TITLE' : 'MUSIC.UNAVAILABLE') | translate"
>
  {{ music.playing() ? 'Ⅱ' : '♪' }}
  <span>{{ (music.playing() ? 'MUSIC.PAUSE' : 'MUSIC.PLAY') | translate }}</span>
</button>
